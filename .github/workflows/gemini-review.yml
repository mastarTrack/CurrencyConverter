name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google AI SDK
        run: pip install -q -U google-generativeai

      - name: Gemini Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<EOF
          import os
          import google.generativeai as genai
          import subprocess

          # 1. Gemini 설정
          genai.configure(api_key=os.getenv("GEMINI_API_KEY"))
          model = genai.GenerativeModel('gemini-1.5-pro')

          # 2. 코드 변경점(diff) 추출
          diff = subprocess.check_output(["git", "diff", "HEAD^", "HEAD"]).decode("utf-8")

          # 3. 프롬프트 구성
          prompt = f"""당신은 시니어 iOS 개발자입니다. 다음 Swift 코드 변경점을 리뷰해 주세요.
          중점 사항: MVVM 준수, 메모리 릭(retain cycle), SwiftUI/UIKit 관행, async/await 스레드 안전성.
          개선 방법과 이유를 한국어로 상세히 작성해 주세요.

          Code Diff:
          {diff}"""

          # 4. 리뷰 생성 및 댓글 달기
          response = model.generate_content(prompt)
          with open("comment.txt", "w") as f:
              f.write(response.text)
          
          # GitHub CLI를 사용하여 PR에 댓글 게시
          subprocess.run(["gh", "pr", "comment", os.getenv("PR_NUMBER"), "--body-file", "comment.txt"])
          EOF
