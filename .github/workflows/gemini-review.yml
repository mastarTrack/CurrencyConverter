name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 모든 히스토리를 가져옵니다

      - name: Gemini Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 1. PR의 시작점과 끝점을 명확히 비교
          DIFF=$(git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
          
          # 2. 디버깅용: 만약 또 안 나오면 로그에서 확인할 수 있게 출력
          if [ -z "$DIFF" ]; then
            echo "--- Debug Info ---"
            echo "Base SHA: ${{ github.event.pull_request.base.sha }}"
            echo "Head SHA: ${{ github.event.pull_request.head.sha }}"
            echo "No diff found between these SHAs."
            exit 0
          fi

          # 3. Gemini 호출 (JSON 안전 처리 포함)
          # 파이썬으로 안전하게 JSON을 만들어서 특수문자 깨짐 방지
          python3 -c "
          import json, os
          diff_content = \"\"\"$DIFF\"\"\"
          prompt = f'당신은 시니어 iOS 개발자입니다. 다음 Swift 코드 변경점을 한국어로 리뷰하세요:\n{diff_content}'
          data = {'contents': [{'parts': [{'text': prompt}]}]}
          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False)
          "

          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @data.json)

          REVIEW_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$REVIEW_TEXT" ]; then
            echo "API Response error or safety filter triggered: $RESPONSE"
            exit 1
          fi

          echo "$REVIEW_TEXT" > comment.txt
          gh pr comment $PR_NUMBER --body-file comment.txt
