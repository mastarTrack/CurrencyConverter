name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -q -U google-generativeai

      - name: Gemini Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<EOF
          import os
          import google.generativeai as genai
          import subprocess
          import sys

          try:
              # 1. API 키 확인
              api_key = os.getenv("GEMINI_API_KEY")
              if not api_key:
                  print("Error: GEMINI_API_KEY is missing in Secrets.")
                  sys.exit(1)

              genai.configure(api_key=api_key)
              
              # 2. 모델 설정 (가장 에러 없는 flash 모델로 우선 시도)
              model = genai.GenerativeModel('gemini-1.5-flash')

              # 3. Diff 추출 (가장 안전한 방식)
              # PR의 base와 head 사이의 차이점을 가져옴
              base_sha = "${{ github.event.pull_request.base.sha }}"
              head_sha = "${{ github.event.pull_request.head.sha }}"
              diff = subprocess.check_output(["git", "diff", base_sha, head_sha]).decode("utf-8")

              if not diff:
                  print("No code changes to review.")
                  sys.exit(0)

              # 4. 리뷰 생성
              prompt = f"iOS 시니어 개발자로서 다음 코드를 한국어로 리뷰해줘:\n\n{diff}"
              response = model.generate_content(prompt)
              
              # 5. 댓글 작성
              with open("comment.txt", "w") as f:
                  f.write(response.text)
              
              subprocess.run(["gh", "pr", "comment", os.getenv("PR_NUMBER"), "--body-file", "comment.txt"], check=True)
              print("Success!")

          except Exception as e:
              print(f"Final Error: {e}")
              sys.exit(1)
          EOF
