name: Gemini PR Review (Free API Key)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  gemini_review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Gemini Code Review (comment on PR)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # 1) PR diff 저장
          git diff "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > diff.txt

          if [ ! -s diff.txt ]; then
            echo "변경 사항이 없습니다."
            exit 0
          fi

          # 2) (중요) 이 러너/키에서 사용 가능한 모델 목록 조회
          curl -sS -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            "https://generativelanguage.googleapis.com/v1/models" > models.json

          # 3) generateContent 지원 + flash 계열 모델 자동 선택 (없으면 최신 alias/다른 모델 폴백)
          MODEL_NAME=$(
            jq -r '
              .models[]
              | select((.supportedGenerationMethods // []) | index("generateContent"))
              | .name
            ' models.json | grep -E 'gemini-.*flash' | head -n 1 || true
          )

          if [ -z "$MODEL_NAME" ]; then
            # flash가 안 보이면 generateContent 가능한 모델 아무거나(보통 pro 등)로 폴백
            MODEL_NAME=$(
              jq -r '
                .models[]
                | select((.supportedGenerationMethods // []) | index("generateContent"))
                | .name
              ' models.json | head -n 1 || true
            )
          fi

          if [ -z "$MODEL_NAME" ]; then
            echo "이 러너/키 조합에서 generateContent 가능한 모델을 찾지 못했습니다."
            echo "---- models.json 일부 ----"
            jq -r '.models[] | "\(.name) | methods=\(.supportedGenerationMethods // [])"' models.json | head -n 50
            exit 1
          fi

          echo "Using model: $MODEL_NAME"
          MODEL_ID="${MODEL_NAME#models/}"

          # 4) 요청 JSON 생성(안전하게 diff.txt 읽기)
          python3 - <<'PY'
          import json
          diff_content = open("diff.txt", "r", encoding="utf-8", errors="replace").read()
          prompt = (
              "당신은 시니어 iOS 개발자입니다. 다음 Swift 코드 변경점을 한국어로 리뷰하고 개선안을 제안하세요.\n"
              "요구사항:\n"
              "- MVVM 아키텍처 관점에서 문제점 지적\n"
              "- 메모리 누수/retain cycle 가능성\n"
              "- UIKit/Swift Concurrency( async/await, MainActor ) 관점 개선\n"
              "- 성능/스레드 안전성\n"
              "- 가능한 경우 짧은 코드 예시로 리팩토링 제안\n\n"
              "=== DIFF START ===\n"
              + diff_content +
              "\n=== DIFF END ==="
          )
          data = {
              "contents": [{"parts": [{"text": prompt}]}]
          }
          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False)
          PY

          # 5) generateContent 호출 (v1)
          RESPONSE=$(curl -sS -X POST \
            "https://generativelanguage.googleapis.com/v1/models/${MODEL_ID}:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @data.json)

          REVIEW_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$REVIEW_TEXT" ]; then
            echo "--- API 응답 에러 로그 ---"
            echo "$RESPONSE" | jq -r '.'
            exit 1
          fi

          # 6) PR 코멘트 달기
          echo "$REVIEW_TEXT" > comment.txt
          gh pr comment "$PR_NUMBER" --body-file comment.txt
