- name: Gemini Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 1. 변경 사항 추출
          DIFF=$(git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
          
          if [ -z "$DIFF" ]; then
            echo "변경 사항이 없습니다."
            exit 0
          fi

          # 2. Python으로 JSON 생성 (이스케이프 방지용)
          python3 - <<EOF
          import json, os
          diff_content = r"""$DIFF"""
          prompt = f"당신은 시니어 iOS 개발자입니다. 다음 Swift 코드 변경점을 한국어로 리뷰하고 개선안을 제안하세요:\n\n{diff_content}"
          # 모델명을 'gemini-1.5-flash'로 명시
          data = {"contents": [{"parts": [{"text": prompt}]}]}
          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False)
          EOF

          # 3. [핵심] v1beta가 아닌 v1 경로로 직접 호출
          # 404 에러의 원인인 v1beta를 완전히 배제합니다.
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @data.json)

          # 4. 결과 확인
          REVIEW_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$REVIEW_TEXT" ]; then
            echo "--- API 응답 에러 로그 ---"
            echo "$RESPONSE"
            exit 1
          fi

          # 5. 댓글 게시
          echo "$REVIEW_TEXT" > comment.txt
          gh pr comment $PR_NUMBER --body-file comment.txt
