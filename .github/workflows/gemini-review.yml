name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Latest Google GenAI SDK
        # 중단된 패키지 대신 최신 패키지를 설치합니다.
        run: pip install -q -U google-genai

      - name: Gemini Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<EOF
          import os
          import subprocess
          import sys
          from google import genai

          try:
              api_key = os.getenv("GEMINI_API_KEY")
              if not api_key:
                  raise ValueError("GEMINI_API_KEY가 설정되지 않았습니다.")

              # 1. 최신 SDK 클라이언트 생성
              client = genai.Client(api_key=api_key)

              # 2. 변경 사항(diff) 가져오기
              base_sha = "${{ github.event.pull_request.base.sha }}"
              head_sha = "${{ github.event.pull_request.head.sha }}"
              diff = subprocess.check_output(["git", "diff", base_sha, head_sha]).decode("utf-8")

              if not diff.strip():
                  print("변경 사항이 없습니다.")
                  sys.exit(0)

              # 3. 최신 문법으로 리뷰 생성
              # 모델명 앞에 'models/'를 붙이지 않는 것이 최신 SDK의 표준입니다.
              response = client.models.generate_content(
                  model="gemini-1.5-flash",
                  contents=f"당신은 시니어 iOS 개발자입니다. 다음 Swift 코드 변경점을 한국어로 리뷰하고 개선안을 제안하세요:\n\n{diff}"
              )

              # 4. 결과 저장
              with open("comment.txt", "w", encoding="utf-8") as f:
                  f.write("### 🤖 Gemini 시니어 iOS 개발자 리뷰\n\n")
                  f.write(response.text)

              # 5. GitHub CLI로 댓글 게시
              pr_number = "${{ github.event.pull_request.number }}"
              subprocess.run(["gh", "pr", "comment", pr_number, "--body-file", "comment.txt"], check=True)
              print("리뷰 작성을 완료했습니다.")

          except Exception as e:
              print(f"최종 에러 발생: {e}")
              sys.exit(1)
          EOF
