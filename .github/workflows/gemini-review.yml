- name: Gemini Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 1. Diff 추출
          DIFF=$(git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
          
          if [ -z "$DIFF" ]; then
            echo "변경 사항이 없습니다."
            exit 0
          fi

          # 2. JSON 데이터 생성 (파이썬 경고 해결 버전)
          # r""" 를 사용하여 이스케이프 시퀀스 문제를 방지합니다.
          python3 - <<EOF
          import json, os
          diff_content = os.getenv("DIFF_CONTENT", "")
          prompt = f"당신은 시니어 iOS 개발자입니다. 다음 Swift 코드 변경점을 한국어로 리뷰하세요:\n\n{diff_content}"
          data = {"contents": [{"parts": [{"text": prompt}]}]}
          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False)
          EOF
          env:
            DIFF_CONTENT: ${{ env.DIFF }} # 환경변수로 전달하여 파이썬 내 삽입 에러 방지

          # 3. API 호출 (v1beta 대신 v1 사용 시도)
          # 무료 등급에서 가장 안정적인 v1 엔드포인트입니다.
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @data.json)

          # 4. 결과 확인
          REVIEW_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$REVIEW_TEXT" ]; then
            echo "--- API ERROR LOG ---"
            echo "$RESPONSE"
            # v1도 실패할 경우를 대비해 v1beta로 재시도 로직을 넣거나 에러 출력
            exit 1
          fi

          echo "$REVIEW_TEXT" > comment.txt
          gh pr comment $PR_NUMBER --body-file comment.txt
