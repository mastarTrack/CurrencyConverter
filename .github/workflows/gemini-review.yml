name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Gemini Code Review
        # @v1 버전 정보를 명시했습니다.
        uses: mshick/google-gemini-code-review-action@v1
        with:
          api-key: ${{ secrets.GEMINI_API_KEY }}
          model: "gemini-1.5-pro"
          rules: |
            당신은 시니어 iOS 개발자입니다. 다음 Swift 코드를 한국어로 리뷰하세요.
            1. MVVM 아키텍처 위반 여부
            2. 메모리 릭 (retain cycle, 클로저 캡처)
            3. UIKit/SwiftUI 권장 설계 방식
            4. async/await 오용 및 스레드 안정성
            구체적인 개선 방법과 이유를 설명하세요.
