name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # 최신 권장 버전으로 업그레이드

      - name: Install dependencies
        run: pip install -q -U google-genai # 최신 패키지 설치

      - name: Gemini Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<EOF
          import os
          import subprocess
          import sys
          from google import genai

          try:
              # 1. 새로운 클라이언트 설정
              api_key = os.getenv("GEMINI_API_KEY")
              client = genai.Client(api_key=api_key)
              
              # 2. Diff 추출
              base_sha = "${{ github.event.pull_request.base.sha }}"
              head_sha = "${{ github.event.pull_request.head.sha }}"
              diff = subprocess.check_output(["git", "diff", base_sha, head_sha]).decode("utf-8")

              if not diff:
                  print("변경 사항이 없습니다.")
                  sys.exit(0)

              # 3. 새로운 SDK 방식으로 리뷰 생성
              prompt = f"시니어 iOS 개발자로서 다음 Swift 코드 변경점을 한국어로 리뷰하세요. MVVM, 메모리릭, async/await 위주로 확인하고 개선 방안을 제안하세요:\n\n{diff}"
              
              response = client.models.generate_content(
                  model="gemini-1.5-flash", # 또는 "gemini-1.5-pro"
                  contents=prompt
              )
              
              # 4. 결과 저장 및 댓글 달기
              review_text = response.text
              with open("comment.txt", "w") as f:
                  f.write(review_text)
              
              subprocess.run(["gh", "pr", "comment", os.getenv("PR_NUMBER"), "--body-file", "comment.txt"], check=True)
              print("리뷰 성공!")

          except Exception as e:
              print(f"최종 에러 발생: {e}")
              sys.exit(1)
          EOF
