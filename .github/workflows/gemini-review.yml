name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gemini Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 1. 변경 사항(diff) 추출
          DIFF=$(git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
          
          if [ -z "$DIFF" ]; then
            echo "변경 사항이 없습니다."
            exit 0
          fi

          # 2. 프롬프트 구성 (JSON 형식 준수)
          # 무료 등급은 데이터 전송량이 제한적이므로 프롬프트를 핵심만 전달합니다.
          PROMPT="당신은 시니어 iOS 개발자입니다. 다음 Swift 코드의 변경점을 한국어로 리뷰하고, MVVM/메모리릭/SwiftUI 관행 위주로 개선안을 제안하세요. 코드: $DIFF"

          # 3. API 호출 (curl 사용 - 라이브러리 의존성 제거)
          # 모델명 뒤에 ?key= 형식을 사용하는 것이 무료 등급에서 가장 안정적입니다.
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"contents\": [{
                \"parts\": [{
                  \"text\": \"$(echo "$PROMPT" | sed 's/"/\\"/g' | tr -d '\n')\"
                }]
              }]
            }")

          # 4. 결과 추출 및 댓글 달기
          # API 응답에서 텍스트만 파싱 (jq 사용)
          REVIEW_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // "리뷰 생성 실패: API 응답을 확인하세요."')

          if [ "$REVIEW_TEXT" == "null" ] || [ -z "$REVIEW_TEXT" ]; then
            echo "API 응답 오류: $RESPONSE"
            exit 1
          fi

          # 5. PR에 댓글 남기기
          echo "$REVIEW_TEXT" > comment.txt
          gh pr comment $PR_NUMBER --body-file comment.txt
