name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 히스토리를 가져와야 비교가 가능합니다.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google AI SDK
        run: pip install -q -U google-generativeai

      - name: Gemini Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<EOF
          import os
          import google.generativeai as genai
          import subprocess
          import sys

          try:
              # 1. API 설정
              api_key = os.getenv("GEMINI_API_KEY")
              if not api_key:
                  print("Error: GEMINI_API_KEY가 없습니다.")
                  sys.exit(1)
              
              genai.configure(api_key=api_key)

              # 2. 모델 설정 (무료 등급용 가장 안전한 명칭 사용)
              # v1beta 404 에러를 방지하기 위해 모델 개체를 직접 정의합니다.
              model = genai.GenerativeModel('gemini-1.5-flash')

              # 3. 변경 사항(diff) 가져오기
              # PR의 기준 브랜치와 현재 브랜치를 비교합니다.
              base_sha = "${{ github.event.pull_request.base.sha }}"
              head_sha = "${{ github.event.pull_request.head.sha }}"
              diff = subprocess.check_output(["git", "diff", base_sha, head_sha]).decode("utf-8")

              if not diff.strip():
                  print("변경 사항이 없습니다.")
                  sys.exit(0)

              # 4. 프롬프트 작성
              prompt = f"당신은 시니어 iOS 개발자입니다. 다음 Swift 코드 변경점을 한국어로 리뷰하고, MVVM 준수 여부 및 메모리 릭(retain cycle) 가능성을 체크하세요:\n\n{diff}"

              # 5. 리뷰 생성
              response = model.generate_content(prompt)
              review_text = response.text

              # 6. GitHub PR에 댓글 달기 (gh CLI 사용)
              with open("comment.txt", "w", encoding="utf-8") as f:
                  f.write("### 🤖 Gemini 시니어 iOS 개발자 리뷰\n\n")
                  f.write(review_text)
              
              pr_number = "${{ github.event.pull_request.number }}"
              subprocess.run(["gh", "pr", "comment", pr_number, "--body-file", "comment.txt"], check=True)
              print("리뷰 작성 성공!")

          except Exception as e:
              print(f"에러 발생: {e}")
              sys.exit(1)
          EOF
