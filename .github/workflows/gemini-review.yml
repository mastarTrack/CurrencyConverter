name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 변경 사항을 읽기 위해 필요

      - name: Gemini Code Review
        uses: anc95/automated-review-action@v2.2.3 # 실존하는 버전
        with:
          # 반드시 아래 변수명(MODEL, GOOGLE_API_KEY)을 지켜야 합니다.
          provider: google
          model: gemini-1.5-pro
          google_api_key: ${{ secrets.GEMINI_API_KEY }}
          language: Korean
          prompt: |
            당신은 시니어 iOS 개발자입니다. 다음 사항을 중점적으로 리뷰하세요:
            - MVVM 아키텍처 위반 및 메모리 릭 (retain cycle)
            - UIKit/SwiftUI 권장 설계 및 async/await 사용법
            - 성능 및 스레드 안정성
